<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5f3c21" />
      <stop offset="50%" stop-color="#784e2d" />
      <stop offset="100%" stop-color="#967049" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf9" />
      <stop offset="100%" stop-color="#f4ece1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6bfa3" />
      <stop offset="100%" stop-color="#f4ece1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#331e0f" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle (Rich Warm Brown) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow inner ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#e8d9c5" stroke-width="4" stroke-opacity="0.35" />

  <!-- Main emblem group with shadow -->
  <g filter="url(#shadow)">
    <!-- Open Book Base (Warm Cream Ivory) -->
    <path d="M120 330 C180 300 240 310 256 330 C272 310 332 300 392 330 L392 210 C332 180 272 190 256 210 C240 190 180 180 120 210 Z" fill="url(#bookGrad)" />
    
    <!-- Spine divider -->
    <path d="M256 210 L256 330" stroke="#d6bfa3" stroke-width="5" stroke-linecap="round" />

    <!-- AI Sparkle / Brain Nodes above Book -->
    <!-- Center AI Sparkle -->
    <path d="M256 100 L264 135 L295 145 L264 155 L256 190 L248 155 L217 145 L248 135 Z" fill="#fffdf9" />
    <circle cx="256" cy="145" r="5" fill="#784e2d" />

    <!-- Left Sparkle -->
    <path d="M175 140 L180 160 L200 165 L180 170 L175 190 L170 170 L150 165 L170 160 Z" fill="#fffdf9" opacity="0.95" />

    <!-- Right Sparkle -->
    <path d="M337 140 L342 160 L362 165 L342 170 L337 190 L332 170 L312 165 L332 160 Z" fill="#fffdf9" opacity="0.95" />

    <!-- Connecting neural lines -->
    <path d="M185 170 Q215 155 245 150" stroke="#fffdf9" stroke-width="3" stroke-dasharray="4,4" opacity="0.75" />
    <path d="M327 170 Q297 155 267 150" stroke="#fffdf9" stroke-width="3" stroke-dasharray="4,4" opacity="0.75" />

    <!-- Text lines on left book page -->
    <line x1="150" y1="240" x2="225" y2="240" stroke="#784e2d" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <line x1="150" y1="265" x2="220" y2="265" stroke="#967049" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <line x1="150" y1="290" x2="200" y2="290" stroke="#b89572" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Text lines on right book page (Tamil / AI script motif) -->
    <line x1="287" y1="240" x2="362" y2="240" stroke="#784e2d" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <line x1="292" y1="265" x2="362" y2="265" stroke="#967049" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <line x1="312" y1="290" x2="362" y2="290" stroke="#b89572" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Offline badge ribbon below -->
    <rect x="186" y="360" width="140" height="34" rx="17" fill="#fffdf9" />
    <circle cx="210" cy="377" r="5" fill="#2d6a4f" />
    <text x="224" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#784e2d">OFFLINE AI</text>
  </g>
</svg>
